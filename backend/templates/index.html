<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChargeFinder</title>
</head>
<body>

    <h1>ChargeFinder</h1>

    <h2>Submit a Charging Station</h2>

    <form action="/submit" method="POST">

        <label>Station Name:</label>
        <input type="text" name="station_name">

        <br><br>

        <label>Area:</label>
        <input type="text" name="area">

        <br><br>

        <label>Connector Type:</label>
        <select name="connector_type">
            <option value="">Select Connector</option>
            <option value="CCS2">CCS2</option>
            <option value="Type 2">Type 2</option>
            <option value="CHAdeMO">CHAdeMO</option>
        </select>

        <br><br>

        <button type="submit">Submit Station</button>

    </form><br>

    <hr>

        {% if results %}
        {% for station in results %}
            <p><strong>Station Name:</strong> {{station[1]}}</p> 
            <p><strong>Area:</strong> {{station[2]}}</p>
            <p><strong>Connector Type:</strong> {{station[3]}}</p> 
        {% endfor %}
    {% else %}
        <p>No Approved Station</p>
    {% endif %}

</body>
</html>
